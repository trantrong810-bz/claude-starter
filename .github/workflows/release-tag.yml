# Tag vX.Y.Z after the release PR (/release) merges into main.
# GitHub rebase-merge changes commit hashes, so the tag can only be created after the merge (docs/GIT.md).
name: release-tag

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  tag:
    if: startsWith(github.event.head_commit.message, 'release:')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Tag the release
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          tag=$(node scripts/version.mjs tag)
          git push origin "$tag"
