# Check every PR into main. The `verify` job is the required status check (scripts/github-setup.sh).
name: verify

on:
  pull_request:
  push:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # tags and main for version.mjs, turbo --filter
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install pnpm
        if: hashFiles('package.json') != ''
        uses: pnpm/action-setup@v4
      - name: Install dependencies
        if: hashFiles('package.json') != ''
        run: pnpm install --frozen-lockfile
      - name: verify
        env:
          VERIFY_BASE: origin/${{ github.base_ref || 'main' }}
        # The kit repo has no package.json: quick part only (secrets, ADR, todo, workflow index, changelog, language).
        run: |
          if [ -f package.json ]; then
            bash scripts/verify.sh
          else
            bash scripts/verify.sh --quick
          fi
